name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r skills/data-quality/scripts/requirements.txt pytest pyarrow
      - name: Run test suite
        run: python -m pytest tests/ -q

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan complete Git history
        shell: bash
        run: |
          set -euo pipefail
          scan_dir="$(mktemp -d "${RUNNER_TEMP}/gitleaks.XXXXXX")"
          trap 'rm -rf "$scan_dir"' EXIT
          archive="$scan_dir/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$scan_dir" gitleaks
          "$scan_dir/gitleaks" git --redact --no-banner \
            --log-opts='--all --full-history' .
